name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            application/pom.xml
            api-tests-lombok/pom.xml
            e2e-tests/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend into application resources
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test and package application
        run: mvn -B -ntp -f application/pom.xml clean package

      - name: Start application and wait for health check
        run: |
          java -jar application/target/issuehub-application-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/issuehub.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/issuehub.log"
          exit 1

      - name: Test API with JUnit and Lombok
        run: mvn -B -ntp -f api-tests-lombok/pom.xml clean test

      - name: Test UI with Selenium
        run: >-
          mvn -B -ntp -f e2e-tests/pom.xml clean test
          -DuiBaseUrl=http://localhost:8080
          -DapiBaseUrl=http://localhost:8080
          -Dheadless=true

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics
          if-no-files-found: ignore
          path: |
            application/target/surefire-reports/
            api-tests-lombok/target/surefire-reports/
            api-tests-lombok/target/allure-results/
            e2e-tests/target/surefire-reports/
            e2e-tests/target/allure-results/
            e2e-tests/target/screenshots/
            ${{ runner.temp }}/issuehub.log
